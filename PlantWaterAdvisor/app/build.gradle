plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.plantwise.wateradvisor'
    compileSdk 35

    defaultConfig {
        applicationId "com.plantwise.wateradvisor"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // A compressed .tflite asset cannot be memory-mapped. Keep it stored as-is.
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // Interpreter API used to load water.tflite and run on-device inference.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
}
